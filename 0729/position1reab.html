<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
.box{
    width: 150px;
    height:150px;
    /* position: static; */
    /* 아무포지션없는것 static 생략가능 */
}
.box1{
    background-color: aqua;
}
.bigbox{
  position: relative;
  width: 700px;
  height: 400px;
  border: 1px solid;
  margin: 0 auto;
}
.box2{
  position: absolute;
  right: 50px;
  bottom: 50px;
    background-color: tan;

}
.box3{
    background-color: tomato;
}
.box4{
    background-color: yellowgreen;
}
</style>
</head>
<body>
    <div class="box box1">박스1</div>
    <div class="bigbox">
      <div class="box box2">박스2</div>
      <div class="box box3">박스3</div>
    </div>
    <div class="box box4">박스4</div>
</body>
</html>
