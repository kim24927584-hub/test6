<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>올리브영 랭킹</title>
  <style>
    .container{

    }
    .box{

    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box box1">
      <img src="images/olive1.jpg" alt="올리브1">
      <div class="text">
        <p class="p1"><strong>퍼셀</strong></p>
        <p class="p2">
          [7/23하루특가/대용량] 퍼셀 20억/mL <br> 픽셀바이옴 원액 55ml
        </p>
        <p class="p3">
          <span class="s1"><del>59,000원</del></span>
          <span class="s2">35,900원</span>
        </p>
        <p class="p4">
          <span class="sale">세일</span>
          <span class="coupon">쿠폰</span>
          <span class="gift"></span>
          <span class="today">오늘드림</span>
        </p>
      </div>
    </div>
    <div class="box box2">
      <img src="images/olive2.jpg" alt="올리브2">
      <div class="text">
        <p class="p1"><strong>가희</strong></p>
        <p class="p2">
          [보송밀착/2개구성] 가히 에어리 핏<br> 선스틱 더블 기획(14g+14g)
        </p>
        <p class="p3">
          <span class="s1"><del>36,000원</del></span>
          <span class="s2">27,400원</span>
        </p>
        <p class="p4">
          <span class="sale">세일</span>
          <span class="coupon">쿠폰</span>
          <span class="today">오늘드림</span>
        </p>
      </div>
    </div>

  </div>
</body>
</html>
