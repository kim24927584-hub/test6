<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0;padding: 0;}
    #myball{
      position:relative;
      width: 116px;height: 160px;
      border-radius: 50%;
      border: solid 1px;
      background: url(animation/bg-main1.png)no-repeat 50% 50%;
      animation-name: myani;
      animation-duration: 3s;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    @keyframes myani{
      0%{top:10px}
      100%{top:500px}
    }
  </style>
</head>
<body>
  <div id="myball"></div>
</body>
</html>
