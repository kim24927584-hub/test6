<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #myball{
      position: relative;
      width: 100px;height: 100px;
      border-radius: 50%;
      border: 1px solid;
      background: url(animation/f1.png) no-repeat 50% 50%;
      /*애니메이션 이름*/
      animation-name: myani;
      /*애니메이션 시간*/
      animation-duration: 1s;
      /*애니메이션 반복횟수*/
      animation-iteration-count: infinite;
      /*대조되는 움직임을 줘서 왕복하는것처럼 나옴*/
      animation-direction: alternate;
    }
    @keyframes myani{
      0%{left:10px;}
      100%{left:500px;}
    }
  </style>
</head>
<body>
  <div id="myball"></div>
</body>
</html>
