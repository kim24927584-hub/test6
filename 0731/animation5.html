<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #myball{
      position: relative;
      width: 100px;height: 100px;
      border-radius: 50%;
      border: 1px solid;
      background: url(animation/f1.png) no-repeat 50% 50%;
      
      animation: myani 3s forwards ease-in-out;
      /*애니메이션 끝부분 상태로 종료 liner 일정한 속도*/
    }

    @keyframes myani{
      0%{left:10px;}
      100%{left:500px;}
    }

  </style>
</head>
<body>
  <div id="myball"></div>
</body>
</html>
