<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f5f5f5;
            padding: 30px;
    }
    .container{
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .card{
      width: 300px;
      background:white;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;

      /* 애니메이션 */
      transition: all 0.5s;
    }
    .card:hover{
      transform: translateY(-10px);
      box-shadow: 0 10px 20px gray;
    }
     img{
            width: 100%;
            display: block;
        }

        .text{
            padding: 20px;
        }

        h3{
            margin-bottom: 10px;
        }

        p{
            color: #666;
            line-height: 1.6;
        }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="https://picsum.photos/300/200" alt="">
      <div class="text">
        <h3>선명한 사진</h3>
        <p>아름다운 자연경관<br>심미성을 가진 작품입니다.</p>
      </div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/300/200" alt="">
      <div class="text">
        <h3>선명한 사진</h3>
        <p>아름다운 자연경관<br>심미성을 가진 작품입니다.</p>
      </div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/300/200" alt="">
      <div class="text">
        <h3>선명한 사진</h3>
        <p>아름다운 자연경관<br>심미성을 가진 작품입니다.</p>
      </div>
    </div>
  </div>
</body>
</html>
