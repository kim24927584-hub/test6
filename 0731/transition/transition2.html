<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button{
      padding: 15px 30px;
      background-color: royalblue;
      color: white;
      border: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    button:hover{
      background-color: darkblue;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <button type="button">확인</button>
</body>
</html>
