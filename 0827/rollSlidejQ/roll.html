<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<style>
    *{margin: 0;padding: 0;}
    li{
        list-style: none;
        float: left;
        width: 80px;
        /* 여백 고려해서 80 - 이미지 한장은 72px */
    }
    h1{text-align: center;}
    #banner_wrap{
        width: 260px;
        height:120px;
        padding: 10px 20px;
        margin: 0 auto;
        border: 1px solid #aaa;
    }

    #banner{
        width: 800px;
        height: 54px;
        border: 1px solid red;
    }
    #frame{
        width: 232px;/*72px 흰색배경 80px  */
        height: 54px;
        position: relative;
        margin: 10px auto;
        border: 1px solid blue;
        /* overflow: hidden;   */
    }


</style>

</head>
<body>
    <h1>롤링 슬라이더 배너만들기</h1>
    <div id="banner_wrap">
        <div id="frame">
            <ul id="banner">
                <li><a href="#"><img src="images/pic_t1.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/pic_t2.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/pic_t3.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/pic_t4.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/pic_t5.jpg" alt=""></a></li>
             
            </ul>
        </div>
        <p>
            <a href="#" class="prev"><img src="images/prev_btn.png" alt=""></a>
            <a class="next" href="#"><img src="images/next_btn.png" alt=""></a>
        </p>
    </div>
</body>
</html>
<script>

    // let list = document.getElementById('banner'); //li를 감싸는 넓이 800px
     //let listLi = document.querySelectorAll('#banner li'); //사진을 감싸는 li 총 5개
     
     
     //1.let total = listLi.length; //5개
     let total = $('#banner > li').length;  // 5개
    
     // document.querySelector('#banner>li')  li중 첫번째만 선택 .offsetWidth; li한개의 넓이
      // let li_width = document.querySelector('#banner>li').offsetWidth; => 80
    let li_width = $('#banner>li').eq(0).width(); //80
    //let li_width1 =  parseInt($('#banner>li').eq(0).css('width')); 80px -> 80
     //let li_width = 80; //li 한개당 넓이 80px

     

   
    //  for(let i=0; i < 3 ; i++){
    //     let copyObj = listLi[i].cloneNode(true); //ctrl + c
    //     list.append(copyObj); //ul 맨뒤로 copyObj를 추가하라 ctrl + v
    //  }

     let copy1 = $('#banner>li:lt(3)').clone(); //#banner > li 중 인덱스 번호 3보다 작은(0,1,2)을 clone(복사)
     $("#banner").append(copy1); // #banner 맨뒤로 복사한 (0,1,2) 추가 -> append 뒤로추가

    // let next = document.querySelector('.next');
    // let prev = document.querySelector('.prev');
     let num = 0;
    $(".next").on("click",function(e){
        e.preventDefault();

        if(num === 5){
            num=0;
            $('#banner').css('margin-left','0');
            //트랜지션 , 에니메이션없음  첫번째 사진으로 순간적으로 이동
        }
        num++     
        $('#banner').stop().animate({'margin-left':-li_width * num},500); 
        //num1 -80 , num2-160 , num -240, num4 -320 , num5 - 400 
    });



   $('.prev').on("click",function(e){
        e.preventDefault();

        if(num === 0){
            num=5;
            $('#banner').css('margin-left',-li_width * num); //400
            //트랜지션 , 에니메이션없음  첫번째 사진으로 순간적으로 이동
        }
        num--    
        $('#banner').stop().animate({'margin-left':-li_width * num},500); 
        //num1 -80 , num2-160 , num -240, num4 -320 , num5 - 400 
        
      
    });

    // setInterval(function(){
    //       if(num === 5){
    //         num=0;
    //         $('#banner').css('margin-left','0');
    //         //트랜지션 , 에니메이션없음  첫번째 사진으로 순간적으로 이동
    //     }
    //     num++     
    //     $('#banner').stop().animate({'margin-left':-li_width * num},500); 
    // },2000);

    function autoPlay(){
        
        if(num === 5){
            num=0;
            $('#banner').css('margin-left','0');
            //트랜지션 , 에니메이션없음  첫번째 사진으로 순간적으로 이동
        }
        num++     
        $('#banner').stop().animate({'margin-left':-li_width * num},500); 
        //num1 -80 , num2-160 , num -240, num4 -320 , num5 - 400 
    }
    
    let Id = setInterval(autoPlay, 2000);

    $("#banner").mouseenter(function(){
      clearInterval(Id);
    })
    $("#banner").mouseleave(function(){
      Id = setInterval(autoPlay, 2000);
    })


</script>
