<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://code.jquery.com/jquery-3.1.1.js"></script>
  <script>
    
  // $.getJSON("json데이터", function(result){
    
  // });
  
    $(function(){
      // var url = "http://api.openweathermap.org/data/2.5/forecast?id=1835848&appid=696e1afd8847d65af06dc08565ec2ab6&units=metric";
      var url = "http://api.openweathermap.org/data/2.5/weather?id=1835848&appid=696e1afd8847d65af06dc08565ec2ab6&units=metric";
      $.getJSON(url, function(result){
        console.log(result.dt_txt);
        console.log(result.main.temp_min);
        console.log(result.main.temp_max);
        console.log(result.weather[0].icon);
        

        let $ctemp = result.main.temp;
        let $mintemp = result.main.temp_min;
        let $maxtemp = result.main.temp_max;
        let $cicon = result.weather[0].icon;

        let $now = new Date();
        let $cDate = $now.getFullYear() + "-" + ($now.getMonth() + 1) + "-" + $now.getDate() + "/" + $now.getHours() + ":" + $now.getMinutes(); 


        $(".ctemp").append($ctemp);
        $(".clowtemp").append($mintemp);
        $(".chightemp").append($maxtemp);
        $("h2").prepend($cDate);
        
        $(".cicon").append(`<img src=https://openweathermap.org/img/wn/${$cicon}@2x.png>`)


      });
    })
  
  </script>
</head>
<body>
  <h1>weather api</h1>
  <h2>| 날씨예보</h2>
  <div class="ctemp">현재 온도: </div>
  <div class="clowtemp">최저 온도: </div>
  <div class="chightemp">최고 온도: </div>
  <div class="cicon">아이콘: </div>
  <img src="https://openweathermap.org/payload/api/media/file/10d@2x.png" alt="">
</body>
</html>
