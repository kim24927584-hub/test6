<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0;padding: 0;
      cursor: url(img/mouse_img_32.png), auto;
    }
    ul,li{list-style: none;}
    a{text-decoration: none; color: #000;}
    a:hover{color: red;}
    #mouse_col{
      position: fixed;
      width: 100%;
      height: 2px;
      left: 0;
      top: 0;
      background-color: orangered;
      pointer-events: none;
    }
    #mouse_row{
      position: fixed;
      width: 2px;
      height: 100%;
      left: 0;
      top: 0;
      background-color: orangered;
      pointer-events: none;
    }
    
  </style>
</head>
<body>
  <h1>롤링 슬라이더 배너 만들기</h1>
  <div id="banner.wrap">
    <div id="fram">
      <ul id="banner">
        <li><a href=""><img src="imgaes/pic_ti.jpg" alt=""></a></li>
        <li><a href=""><img src="imgaes/pic_ti.jpg" alt=""></a></li>
        <li><a href=""><img src="imgaes/pic_ti.jpg" alt=""></a></li>
        <li><a href=""><img src="imgaes/pic_ti.jpg" alt=""></a></li>
        <li><a href=""><img src="imgaes/pic_ti.jpg" alt=""></a></li>
      </ul>
    </div>
  </div>
    
  <script>
    document.onmousemove = function(e){
      var x = e.pageX;
      var y = e.pageY;
      
      var ele1 = document.getElementById("mouse_col");
      var ele2 = document.getElementById("mouse_row");
      ele1.style.top = (y)+'px';
      ele2.style.left = (x)+'px';
      // document.getElementById("m2").innerHTML = y;

    }
  </script>
</body>
</html>
