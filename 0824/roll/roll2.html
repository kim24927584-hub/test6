<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0;padding: 0;}
    li{
      list-style: none;
      float: left;
      width: 600px;
    }
    h1{text-align: center;}
    #banner_wrap  {
      width: 600px;
      height: 255px;
      
      margin: 0 auto;
      border: 1px solid #aaa;
      position: relative;
      overflow: hidden;
    }
    .prev{
      position: absolute;
      top: 40%;
      left: 20px;
    }
    .next{
      position: absolute;
      top: 40%;
      right: 60px;
    }
    #banner{
      width: 2400px;
      height: 255px;
      border: 1px solid   red ;
    }
    
  </style>
</head>
<body>
  <h1>롤링 슬라이더 배너 만들기</h1>
  <div id="banner_wrap">
    
      <ul id="banner">
        <li><a href=""><img src="images/car1.jpg" alt=""></a></li>
        <li><a href=""><img src="images/car2.jpg" alt=""></a></li>
        <li><a href=""><img src="images/car3.jpg" alt=""></a></li>
        
        
      </ul>
    
    <p>
      <a href="" class="prev"><img src="images/prev_btn.png" alt=""></a>
      <a href="" class="next"><img src="images/next_btn.png" alt=""></a>
    </p>
  </div>
    
</body>
</html>

<script>
  let list = document.getElementById("banner");
  let listLi = document.querySelectorAll("#banner li");
  list.append(listLi[0].cloneNode(true))


  let next = document.querySelector(".next");
  let prev = document.querySelector(".prev");

  let num = 0;
  let margin = 600;
  next.addEventListener("click", function(e){
    e.preventDefault();

    if(num===3){
      num = 0;
      list.style.transition = "none";
      list.style.marginLeft = `0`;
    }
    // setTimeout(function(){
      num++;
    list.style.transition = "margin-left 0.5s";
    list.style.marginLeft = `${num*(-margin)}px`;
    // }, 0)
    
  })
</script>
