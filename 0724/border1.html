<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      width: 200px;
      height: 100px;
      line-height: 100px;
      text-align: center;
      font-size: 20px;
      /* border: solid 5px red; */

      display: inline-block;
      margin: 15px;
      border-width: 5px;
    }
    #box1{
      border-style: solid;
      border-color: red;
    }
    #box2{
      border-style: dotted;
      border-top-color: red;
    }
    #box3{
      border-style: dashed;
    }
    #box4{
      border-style: double;
    }
  </style>
</head>
<body>
  
  <div id="box1">실선테두리</div>
  <div id="box2">점선테두리</div>
  <div id="box3">짧은 점선테두리</div>
  <div id="box4">이중 테두리</div>
</body>
</html>
