<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .t2{
      text-decoration: underline;
      
    }
    .t3{
      text-decoration: overline;
    }
    .t4{
      text-decoration: line-through;
    }
    .link1 a{
      text-decoration: none;
      color: black;
    }
    .link1 a:hover{
      text-decoration: underline;
    }
    .link1 a:active{
      background-color: aqua;
    }
  </style>
</head>
<body>
  <p class="t1">none</p>
  <p class="t2">underline</p>
  <p class="t3">overline</p>
  <p class="t4">line-through</p>
  <p class="link1"><a href="http://nate.com">네이트로가자1</a></p>
  <p><del>취소선</del></p>
  <p><ins>밑줄</ins></p>
</body>
</html>
