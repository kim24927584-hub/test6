<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<style>
    *{margin: 0; padding: 0;}
    body {
        background: #252422;
    }
    div{
        width: 395px;
        height: 160px;
        margin: 50px auto;
    }
    dl{
        width: 395px;
        height: 160px;
    }
    dt{
        width: 25px;
        height: 160px;
        float: left;
    }

    dt span{
        display: block;
        width: 100%;
        height: 100%;
        text-indent: -9999px;
        background: url(./blue01.png) no-repeat 0 0;
    }

    dt span.selected{
        background: url(./orange01.png) no-repeat 0 0;
    }

    dt span.over{
        background: url(./pink01.png) no-repeat 0 0;
    }

    dd{
        float: left;
        width: 320px;
        height: 160px;
        overflow: hidden;
        transition: all 0.3s;
    }

    dd img{
        float: left;
        width: 320px;
        height: 160px;
    }

</style>
<script>
    $(function(){
        $("dd").css("width", "0px");
        $("dt").click(function(){
            let kkk = $(this).next("dd").css("width");
            $("dd").css("width", "0px");
            if(kkk==="0px"){
                $(this).next().css("width", "320px");
            }
            
            
            $("dt span").removeClass("selected");
            $(this).children("span").addClass("selected");
            
        })
        $("dt").hover(function(){
            
            $(this).children("span").addClass("over");
        }, function(){
            $(this).children("span").removeClass("over");
        })
    })
</script>
<body>
    <div>
        <dl>
            <dt>
                <span>step</span>
            </dt>
            <dd>
                <img src="./menuimg01.jpg" alt="">
            </dd>
            <dt>
                <span>step</span>
            </dt>
            <dd>
                <img src="./menuimg02.jpg" alt="">
            </dd>
            <dt>
                <span>step</span>
            </dt>
            <dd>
                <img src="./menuimg03.jpg" alt="">
            </dd>
        </dl>
    </div>
</body>
</html>
