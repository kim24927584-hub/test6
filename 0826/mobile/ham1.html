<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  <script>
    $(function(){
      $(".ham").click(function(){
        var right1 = $("nav").css("right");
        if(right1 == "-200px"){
          $("nav").css("right", "0px");
          $(this).addClass("on");
        }
        else{
          $("nav").css("right","-200px");
          $(this).removeClass("on");
        } 
        
      })

      $(".m_menu li ul").hide();
      $(".m_menu li a").click(function(e){
        e.preventDefault();

        if($(this).next(".sub").css("display") == "none"){
          $(".sub").slideUp();
          $(this).next(".sub").slideDown();
        }else{
          $(".sub").slideUp();
        }

      })
      
    })
  </script>
  <style>
       * {
        margin: 0;
        padding: 0;
    }

    ul {
        list-style: none;
    }
    body{
        overflow-x: hidden;
    }

    header{
         width: 100%;
        height: 70px;
        position: relative;
        background-color: skyblue;
    }
    header h1{
      line-height: 70px;
      height: 70px;
      text-align: center;
    }
    header p.ham{
      position: absolute;
      width: 50px;
      height: 50px;
      top: 10px;
      right: 10px;
      border: 1px solid #333;
      text-indent: -9999px;
      background: url(images/ham.png) no-repeat 50% 50%;
      cursor: pointer;
    }
    header p.ham.on{
      background: url(images/bar.png) no-repeat 50% 50%;
    }
    nav{
      width: 200px;
      background-color: lime;
      /* padding: 10px 0; */
      position: absolute;
      top: 70px;
      right: 0px;
      transition: all 0.3s;
    }
    /* nav ul li{
      height: 40px;
      line-height: 40px;
      text-align: center;
      font-weight: bold;
    } */
    a {
            text-decoration: none;
            color: #333;
        }
        .m_menu{
          width: 200px;
          /* margin: 100px auto 0; */
          text-align: center;
        }
        .m_menu > li > a{
          display: block;
          height: 36px;
          background-color: #390;
          line-height: 36px;
          border-top: 1px dotted #fff;
          color: #fff;
        }

        .m_menu .sub li{
          background-color: #cf9;
        }
        .m_menu .sub li a{
          display: block;
          line-height: 36px;
          height: 36px;
          color: #222;
        }
        .m_menu .sub li a:hover{
          background-color: #cf0;
        }
  </style>
</head>
<body>
  <header>
    <h1>The Joeun</h1>
    <p class="ham on">메뉴바</p>
  </header>
  <nav>
    <ul class="m_menu">
        <li>
            <a href="#">회사소개</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">제품소개</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">커뮤니티</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">다운로드</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
    </ul>
  </nav>
  
</body>
</html>
