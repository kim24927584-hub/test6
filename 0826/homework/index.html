<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  <script>
    $(function(){
      $("#btn1").click(function(){$(".box1").hide("slow")})
      $("#btn2").click(function(){$(".box1").show(1000)})
      $("#btn3").click(function(){
        $(".box2").toggle(500)
      })
      $("#btn4").click(function(){
        $(this).parent().next().slideUp(500);
      })
      $("#btn5").click(function(){
        $(this).parent().next().slideDown("fast");
      })
      $("#btn6").click(function(){
        $(this).parent().next().slideToggle("fast");
      })
      $("#btn7").click(function(){
        $(this).parent().next().fadeOut(1000);
      })
      $("#btn8").click(function(){
        $(this).parent().next().fadeIn("slow");
      })
      $("#btn9").click(function(){
        $(this).parent().next().fadeToggle("normal");
      })
      $("#btn10").click(function(){
        $(this).parent().next().fadeTo("slow", 0.3);
      })
      $("#btn11").click(function(){
        $(this).parent().next().fadeTo("slow", 1);
      })
    })
    
  </script>
</head>
<button id="btn1">hide</button>
<button id="btn2">show</button>
<p class="box1">show/hide 대상</p>

<button id="btn3">toggle</button>
<p class="box2">toggle 대상</p>

<p>
  <button id="btn4">slideUp</button>
  <button id="btn5">slideDown</button>
  <button id="btn6">slideToggle</button>
</p>
<p>slide 대상 문단</p>

<p>
  <button id="btn7">fadeOut</button>
  <button id="btn8">fadeIn</button>
  <button id="btn9">fadeToggle</button>
</p>
<p>fade 대상 문단</p>

<p>
  <button id="btn10">fadeTo(0.3)</button>
  <button id="btn11">fadeTo(1)</button>
</p>
<p>fadeTo 대상 문단</p>
</body>
</html>
