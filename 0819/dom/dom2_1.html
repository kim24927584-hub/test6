<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="title">안녕하세요</h1>
  <button id="btn1">
    변경
  </button>
  <script>
    let title = document.getElementById("title");
    document.querySelector("#btn1").addEventListener("click",()=>{title.innerHTML = "hello"})
  </script>
</body>
</html>
