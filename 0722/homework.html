<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>회원가입</h1>
  <form action="/join" method="post">
    <fieldset>
      <legend>회원 정보 입력</legend>
      <p>
        <label for="userid">아이디</label><br>
        <input type="text" id="userid" name="userid" placeholder="아이디를 입력하세요" required> 
        <br><br>
        <label for="userpw">비밀번호</label><br>
        <input type="password" id="userpw" name="">
        <br><br>
        <label for="userpwcheck">비밀번호 확인</label><br>
        <input type="password" id="userpwcheck" name="">
        <br><br>
        <label for="name">이름</label><br>
        <input type="text" id="name" name="">
        <br><br>
        <label for="email">이메일</label><br>
        <input type="email" id="email" name="">
        <br><br>
        <label for="phone">전화번호</label><br>
        <input type="text" id="phone" name="">
        <br><br>
        <label for="birthday">생년월일</label><br>
        <input type="date" id="birthday" name="">
        <br><br>
        <div>
          <label for="sex">성별</label><br>
          <input type="radio"> 남자
           <input type="radio"> 여자
        </div>
        <br><br>
        <div>
          <label for="hoby">취미</label> <br>
          <input type="checkbox"> Java
          <input type="checkbox"> HTML
          <input type="checkbox"> Spring Boot
        </div>
        <br><br>
        <label for="region">지역</label><br>
        <select name="" id="region">
          <option value="soul">서울</option>
          <option value="kkd">경기도</option>
        </select>
        <br><br>
        <label for="job">직업</label><br>
        <input type="text" id="job">
        <br><br>
        <label for="profile">프로필 사진</label><br>
        <input type="file">
<br><br>
<label for="introduce">자기소개</label><br>
<textarea name="" id="" cols="40" rows="4"></textarea>
<br><br>
        <input type="submit" value="회원가입">
        <input type="reset" value="다시작성">
        
      </p>
    </fieldset>
  </form>
</body>
</html>
