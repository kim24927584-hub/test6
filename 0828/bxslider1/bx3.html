<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/jquery.bxslider.css">
  <script src="js/jquery-3.1.1.min.js"></script>
  <script src="js/jquery.bxslider.min.js"></script>
  <style>
    *{margin: 0;padding: 0;}
    header{
      width: 960px;
      height: 200px;
      margin: 0 auto;
      background-color: pink;
    }
    section{
      width: 960px;
      height: 800px;
      margin: 0 auto;
      border: 1px solid red;
    }
  </style>
  <script>
    $(function(){
      $(".slider1").bxSlider({
        auto:true,
        controls:false,
        pager:false,
        mode: 'fade',
        speed: 500,
        pause: 2000,
      });
      $(".slider2").bxSlider({
        auto:true,
        moveSlides:2,
        minSlides:1,
        maxSlides:4,
        sildeWidth:230,
        slideMargin:100,
      });
    })
  </script>
</head>
<body>
  <header>헤더</header>
  <section>
    <ul class="slider1">
      <li><img src="images/pic1.jpg" alt=""></li>
      <li><img src="images/pic2.jpg" alt=""></li>
      <li><img src="images/pic3.jpg" alt=""></li>
      
    </ul>
    <ul class="slider2">
      <li><img src="img/images(1).jpg" alt=""></li>
      <li><img src="img/images(2).jpg" alt=""></li>
      <li><img src="img/images(3).jpg" alt=""></li>
      <li><img src="img/images(4).jpg" alt=""></li>
      <li><img src="img/images(5).jpg" alt=""></li>
    </ul>
  </section>
</body>
</html>
