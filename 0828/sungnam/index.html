<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/jquery.bxslider.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/jquery-3.1.1.min.js"></script>
  <script src="js/jquery.bxslider.min.js"></script>
  <script src="js/main.js"></script>
</head>
<body>
  <div class="contents">
    <div class="left pop_slide">
      <ul class="bxslider">
        <li><a href=""><img src="img/s1.jpg" alt=""></a></li>
        <li><a href=""><img src="img/s2.jpg" alt=""></a></li>
        <li><a href=""><img src="img/s3.jpg" alt=""></a></li>
        <li><a href=""><img src="img/s4.jpg" alt=""></a></li>
        
      </ul>
      <div class="slide-number">
        <span id="current">1</span> / 
        <span id="total">4</span>
      </div>
      <p>
        <a href="" class="pause"></a>
      </p>
      <p class="arrow">
        <a href="" class="prev"></a>
        <a href="" class="next"></a>
      </p>
    </div>
    <div class="slide2 pop_slide">
      <ul class="bxslider2">
        <li><a href=""><img src="img-1/s1.png" alt=""></a></li>
        <li><a href=""><img src="img-1/s2.jpg" alt=""></a></li>
      </ul>

      <div class="control_box">
        <div class="slide-number">
          <span id="current2">1</span>/
          <span id="total">4</span>
        </div>
        <p>
          <a href="" class="pause"></a>
        </p>
        <p class="arrow">
          <a href="" class="prev"></a>
          <a href="" class="next"></a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
