<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0; padding: 0;}
    .content1{
      width: 100%;
      height: 400px;
      border: 1px solid;
      text-align: center; /*블럭 요소 안에 이미지 또는 글자는 text-align: center; 로 중앙정렬 가능*/
      
    }
    .content1 img{margin-top: 50px;}
    .content2{
      width: 100%;
      height: 400px;
      border: 1px solid;
      text-align: center; /*블럭 요소 안에 이미지 또는 글자는 text-align: center; 로 중앙정렬 가능*/
      
    }
    .content2 h1{
      width: 250px;height: 225px;
      border: solid 1px;
      margin: 50px auto 0;
      /* 넓이가 있는 블럭요소는 margin-left:auto margin-right:auto*/
    }
    .content3{
      width: 100%;
      height: 400px;
      border: 1px solid;
      text-align: center; /*블럭 요소 안에 이미지 또는 글자는 text-align: center; 로 중앙정렬 가능*/
      position: relative;
      /* position: absolute; */
    }
    .content3 h1{
      width: 250px;height: 225px;
      border: solid 1px;
      position: absolute;
      left: 50%;
      top: 50%;
      /* margin-left: -125px;
      margin-top: -112px; */
      transform: translate(-50%, -50%);
    }
    .content4{
      width: 100%;
      height: 400px;
      border: 1px solid;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .content4 h1{
      width: 250px;height: 225px;
      border: solid 1px;
      
    }
  </style>
</head>
<body>
  <div class="content1">
    <img src="images/1.jpg" alt="">
  </div>
  <div class="content2">
    <h1 class="logo"><img src="images/1.jpg" alt=""></h1>
  </div>
  <div class="content3">
    <h1 class="logo"><img src="images/1.jpg" alt=""></h1>
  </div>
  <div class="content4">
    <h1 class="logo"><img src="images/1.jpg" alt=""></h1>
  </div>
</body>
</html>
