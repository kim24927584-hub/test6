<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let month = prompt("숫자를 입력하세요: ");
    let season = null;
    if(month >= 3 && month <= 5){
      season = "봄";
    }
    else if(month >= 6 && month <= 8){
      season = "여름";
    }
    else if(month >= 9 && month <= 11){
      season = "가을";
    }
    else if(month == 12 || month == 1 || month == 2){
      season = "겨울";
    }
    else{
      season = "잘못입력했습니다.";
    }

    document.write(season + " 입니다.")

    
  </script>
</body>
</html>
