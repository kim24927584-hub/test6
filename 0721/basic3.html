<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h1{background-color: aqua; width: 50%;}
  </style>
</head>
<body>
  <!-- 블럭요소
  1. 한 줄 전체를 차지한다.
  2. 대표적인 블럭요소: div, p, h1~h6, ul, ol, li, pre, blockquote, address
  3. 항상 줄바꿈이 발생
  4. 넓이(width) 높이(height) 설정 가능
  5. margin(바깥여백), padding(안여백) 설정가능
  6. 블럭요소 안에 인라인 요소 포함 가능 (블럭요소도 포함 가능)
  7. 레이아웃 구성에 주로 사용
  8. dt dd도 블럭 요소에 속한다
   -->

   <!-- 사용자 정의 목록 -->
    <dl>
      <dt>말티즈</dt>
      <dd>사랑스럽고 시기심 많은 강아지</dd>
    </dl>

    <h1>h1 타이틀</h1>
</body>
</html>
