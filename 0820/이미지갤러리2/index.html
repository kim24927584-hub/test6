<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0;padding: 0;}
    ul,li{list-style: none;}
    body{background-color: #333;}
    #wrap{
      display: flex;
      flex-direction: column;
      width: 640px;
      margin: 100px auto 0;
    }
    #nav{
      display: flex;
    }
    #nav li a{
      display: block;
      border: 2px solid #aaa;
      margin: 0 6px 10px 0;
      border-radius: 5px;
      
    }
    #nav li a.active{
      border: 5px solid #fff;
    }
    #nav li a img{
      width: 70px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <ul id="nav">
      <li><a href="img/lop0.jpg" class="active"><img src="img/thumb0.jpg" alt=""></a></li>
      <li><a href="img/lop1.jpg"><img src="img/thumb1.jpg" alt=""></a></li>
      <li><a href="img/lop2.jpg"><img src="img/thumb2.jpg" alt=""></a></li>
      <li><a href="img/lop3.jpg"><img src="img/thumb3.jpg" alt=""></a></li>
      <li><a href="img/lop4.jpg"><img src="img/thumb4.jpg" alt=""></a></li>
      <li><a href="img/lop5.jpg"><img src="img/thumb5.jpg" alt=""></a></li>
      <li><a href="img/lop6.jpg"><img src="img/thumb6.jpg" alt=""></a></li>
      <li><a href="img/lop7.jpg"><img src="img/thumb7.jpg" alt=""></a></li>
    </ul>
    <div id="window"><img src="img/lop0.jpg" alt=""></div>
  </div>
</body>
</html>
<script>
  let navLinks = document.querySelectorAll("#nav li a");
  navLinks.forEach(function(navLink){
    navLink.addEventListener("click", function(e){
      e.preventDefault();
      let imgURL = navLink.getAttribute("href");
      // alert(imgURL);
      document.querySelector("#window img").setAttribute("src", `${imgURL}`);

      navLinks.forEach(function(link){
        link.classList.remove('active');
      });
      navLink.classList.add("active");

    })
  })
</script>
