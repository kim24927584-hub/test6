<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap 5 Tab</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Tab Menu</h2>

    <!-- 탭 버튼 -->
    <ul class="nav nav-tabs" id="myTab">

        <li class="nav-item">
            <button
                class="nav-link active"
                data-bs-toggle="tab"
                data-bs-target="#home">
                홈
            </button>
        </li>

        <li class="nav-item">
            <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#profile">
                프로필
            </button>
        </li>

        <li class="nav-item">
            <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#contact">
                연락처
            </button>
        </li>

    </ul>


    <!-- 탭 내용 -->
    <div class="tab-content mt-3">

        <div
            class="tab-pane fade show active"
            id="home">
            <h3>홈</h3>
            <p>홈 화면입니다.</p>
        </div>

        <div
            class="tab-pane fade"
            id="profile">
            <h3>프로필</h3>
            <p>프로필 화면입니다.</p>
        </div>

        <div
            class="tab-pane fade"
            id="contact">
            <h3>연락처</h3>
            <p>연락처 화면입니다.</p>
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
